name: Render EDA notebook

on:
  push:
    branches: [main]
    paths:
      - "eda.ipynb"
      - "requirements.txt"
      - ".github/workflows/render-notebook.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt nbconvert ipykernel
      - name: Execute notebook and export HTML
        run: |
          jupyter nbconvert --to notebook --execute --inplace eda.ipynb
          jupyter nbconvert --to html eda.ipynb --output index.html
      - name: Commit generated HTML and notebook outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eda.ipynb index.html
          git diff --cached --quiet || (git commit -m "Render EDA notebook" && git push)
